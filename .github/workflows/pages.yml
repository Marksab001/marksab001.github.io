name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A101DD: ${{ secrets.A101DD }}
          BB885A: ${{ secrets.BB885A }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A101DD', '')
          tag_b = os.environ.get('BB885A', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 4b141e62e020c29d5f370638 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 02b38a581e5bf275a6af8c0912e5edb6254c2303 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
